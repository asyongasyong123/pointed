worker_processes auto;
worker_rlimit_nofile 65535;

# ✅ I-declare ang environment variable
env POINTED_SERVER_IP;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 3600;
    keepalive_requests 100000;
    client_max_body_size 0;

    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 10s;

    server {
        listen 8080;
        server_name _;

        # ✅ Health check
        location = / {
            return 200 "✅ Service OK | Forwarding to $POINTED_SERVER_IP";
            add_header Content-Type text/plain always;
        }

        # ✅ Xray paths
        location ^~ /pointed {
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        location ^~ /pointed {
            proxy_pass http://127.0.0.1:10002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        location ^~ /pointed {
            proxy_pass http://127.0.0.1:10004;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        # ✅ Forward padulong sa remote server — gamit ang variable direkta
        location / {
            proxy_pass http://$POINTED_SERVER_IP:8080$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $POINTED_SERVER_IP;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
            proxy_connect_timeout 15s;
        }
    }
}
