name: Build & Push Docker Image

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Dugang: Siguroha nga naay permiso ang entrypoint.sh
      - name: Fix file permissions
        run: chmod +x entrypoint.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER4 }}
          password: ${{ secrets.DOCKER_TOKEN4 }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: jthandg/pointed:latest
          cache-from: type=registry,ref=jthandg/pointed:buildcache
          cache-to: type=registry,ref=jthandg/pointed:buildcache,mode=max
