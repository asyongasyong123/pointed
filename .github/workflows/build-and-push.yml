name: Build & Push Docker Image

on:
  push:
    branches: [ main, master ] # Modagan kung mag-update ka sa main/master branch
  workflow_dispatch: # Pwede nimo sugdan mano-mano gikan sa GitHub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER4 }}
          password: ${{ secrets.DOCKER_TOKEN4 }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: docker.io/jthandg/pointed:latest
          cache-from: type=registry,ref=jthandg/pointed:buildcache
          cache-to: type=registry,ref=jthandg/pointed:buildcache,mode=max
