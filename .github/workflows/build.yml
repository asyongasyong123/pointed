name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: |
          go mod init pointed-proxy 2>/dev/null || true
          go mod tidy
          go build -ldflags="-s -w" -o proxy

      - name: Build and Push Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: gcr.io/jthandg/pointed:latest
